<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Stango Immigration</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <img src="resources/logo.png" alt="Stango Immigration Logo" class="logo">
    </header>
    <main>
        <section class="hero">
            <h1>Contact Us</h1>
            <p>Get in touch with us for any inquiries or questions. We are here to help you achieve your international aspirations.</p>
        </section>
        <section class="contact-form">
            <h2>Contact Form</h2>
            <form id="contactForm">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required><br><br>

                <label for="age">Age:</label>
                <input type="number" id="age" name="age" required><br><br>

                <label for="city">City:</label>
                <input type="text" id="city" name="city" required><br><br>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required><br><br>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required><br><br>

                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
    <footer>
        <img src="resources/logo.png" alt="Stango Immigration Logo" class="logo">
        <p>&copy; 2023 Stango Immigration. All rights reserved.</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
